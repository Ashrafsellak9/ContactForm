<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
      <div class="col-md-6">
        <h1 class="text-center">Contact Us</h1>
        <p class="text-center">Send us a message and we'll get back to you!</p>
        
        <form action="process_contact.php" method="POST" class="card p-4 shadow">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name:</label>
            <input
              type="text"
              name="name"
              id="name"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address:</label>
            <input
              type="email"
              name="email"
              id="email"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message:</label>
            <textarea
              name="message"
              id="message"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>
          <button type="submit" name="submit" class="btn btn-primary w-100">Send Message</button>
        </form>
        
        <hr />
        <a href="view_messages.php" class="btn btn-secondary w-100">View all messages</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
